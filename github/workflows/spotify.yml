name: Actualizar playlists Spotify

on:
  schedule:
    - cron: "45 14 * * 0"   # Domingos 9:45 a. m. hora Colombia (14:45 UTC)
  workflow_dispatch:         # Botón "Run workflow" para correrlo a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar librerías
        run: pip install requests openpyxl

      - name: Actualizar playlists
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CORREO_DESTINO: ${{ secrets.CORREO_DESTINO }}
        run: python spotify_playlists.py actualizar

      - name: Guardar cambios en el repositorio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A reglas_playlists.json procesadas.txt registro_actualizaciones.txt sin_clasificar.xlsx 2>/dev/null || git add -A
          git diff --cached --quiet || git commit -m "Actualización semanal de playlists"
          git push
